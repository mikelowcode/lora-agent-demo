repos:
  - repo: local
    hooks:
      - id: check-no-private-data
        name: block Localist runtime/personal data
        entry: python3 scripts/check_no_private_data.py
        language: system
        pass_filenames: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
        # test fixture data for content_safety.py's own credential scanner,
        # not a real key
        exclude: ^backend/tests/test_content_safety\.py$
